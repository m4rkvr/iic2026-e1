<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Panel de categorías</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  .panel{position:fixed;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);place-items:center}
  /* Teléfono vertical: 2 columnas × 3 filas */
  @media (orientation:portrait){.panel{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
    .hole{width:min(40vw,28vh)!important;font-size:min(11vw,8vh)!important}}
  .hole{width:min(26vw,40vh);aspect-ratio:1;border-radius:50%;border:none;font:800 min(7vw,11vh)/1 system-ui;
        display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s,box-shadow .1s}
  .hole small{font-size:.32em;font-weight:600;margin-top:.3em;opacity:.85}
  .hole.active{transform:scale(.92);box-shadow:0 0 0 .35em #fff}
  .c0{background:#ace5ff;color:#1d2a22}.c1{background:#43c1ff;color:#1d2a22}.c2{background:#1498e4;color:#1d2a22}
  .c3{background:#026cce;color:#fff}.c4{background:#383cad;color:#fff}.c5{background:#3f003c;color:#fff}
  #fs{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2;font:600 16px system-ui;padding:8px 16px;border-radius:8px;border:0}
</style></head><body>
<script src="https://app.protobject.com/framework/p.js"></script>
<button id="fs">Pantalla completa</button>
<!-- Seis agujeros = las seis clases de la escala Saffir-Simpson, con los colores de la página. -->
<div class="panel">
  <button class="hole c0" data-num="1">TT<small>Tormenta</small></button>
  <button class="hole c1" data-num="2">1<small>Categoría</small></button>
  <button class="hole c2" data-num="3">2<small>Categoría</small></button>
  <button class="hole c3" data-num="4">3<small>Categoría</small></button>
  <button class="hole c4" data-num="5">4<small>Categoría</small></button>
  <button class="hole c5" data-num="6">5<small>Categoría</small></button>
</div>
<script>
// Igual que el artefacto 08 del kit: cada botón manda su número a index.html.
(function () {
  const botones = document.querySelectorAll(".hole");

  function enviarNumero(num) {
    botones.forEach((b) => b.classList.toggle("active", b.dataset.num === String(num)));

    Protobject.Core.send({
      tipo: "panel",
      accion: "press",
      id: "zona" + num,
      numero: String(num),
      marcador: String(num),
      valor: Number(num)
    }).to("index.html");

    setTimeout(() => {
      botones.forEach((b) => b.classList.remove("active"));
    }, 180);
  }

  botones.forEach((boton) => {
    const num = boton.dataset.num;
    boton.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      enviarNumero(num);
    });
  });

  document.getElementById("fs").addEventListener("click", () => {
    const d = document.documentElement;
    const pedir = d.requestFullscreen || d.webkitRequestFullscreen;
    if (pedir) pedir.call(d);
    document.getElementById("fs").hidden = true;
  });
})();
</script>
<script src="config.js"></script>
</body></html>
