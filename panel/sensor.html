<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor</title>
<style>
body{margin:0;background:#0f1d26;color:#fff;font:16px system-ui,sans-serif;padding:12px}
h1{font-size:20px;margin:0 0 8px}
button{font:inherit;padding:10px 16px;border-radius:8px;border:0;background:#c2550a;color:#fff;font-weight:700;margin:4px 4px 4px 0}
button:disabled{opacity:.4}
video{width:100%;max-height:50vh;background:#000;border-radius:8px;margin-top:8px}
#info,#est{margin:6px 0;color:#bcd}
</style></head><body>
<h1 id="tit">Sensor</h1>
<div><button id="ini">Iniciar cámara</button><button id="snd">Activar sonido</button><button id="test" disabled>Probar sonido</button></div>
<div id="est">Conectando…</div><div id="info"></div>
<video id="v" playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const $ = i => document.getElementById(i);
const P = new URLSearchParams(location.search);
const rol = P.get("rol") === "frontal" ? "frontal" : "cenital";
const sala = P.get("sala") || "";
const base = "iic2026/sensor/" + sala;
$("tit").textContent = "Teléfono " + rol + " · sala " + sala.toUpperCase();

// ---- conexión ----
const url = P.get("broker") || "wss://broker.emqx.io:8084/mqtt";
const cli = mqtt.connect(url, { reconnectPeriod: 2000, clientId: rol + "-" + Math.random().toString(16).slice(2) });
cli.on("connect", () => { $("est").textContent = "Conectado al servidor."; cli.subscribe(base + "/sonar"); });
cli.on("close", () => { $("est").textContent = "Sin conexión con el servidor, reintentando…"; });
cli.on("message", (t, m) => { try { const d = JSON.parse(m.toString()); if (audioOn) sonar(d.w); } catch (e) {} });

// ---- sonido: viento sintético. Las frecuencias crecen con la velocidad U (m/s); el volumen es fijo ----
let ctx = null, audioOn = false, ruido = null;
$("snd").onclick = async () => {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  ruido = b; audioOn = true; $("snd").disabled = true; $("snd").textContent = "Sonido activo"; $("test").disabled = false;
};
$("test").onclick = () => sonar(120);
function sonar(w) {
  if (!ctx || !ruido) return;
  const U = w * 0.514, t0 = ctx.currentTime, dur = 4;
  const master = ctx.createGain(); master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.5, t0 + 0.15); master.gain.setValueAtTime(0.5, t0 + dur - 0.5);
  master.gain.linearRampToValueAtTime(0, t0 + dur); master.connect(ctx.destination);
  const n = ctx.createBufferSource(); n.buffer = ruido; n.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = Math.min(30 * U, 6000); bp.Q.value = 0.7;
  n.connect(bp); bp.connect(master); n.start(t0); n.stop(t0 + dur);
  const k = Math.max(0, Math.min(1, (w - 20) / 80));   // silbido: cero a ~20 kt, pleno desde ~100 kt
  if (k > 0) for (const m of [20, 8]) {
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = Math.min(m * U, 5000);
    const g = ctx.createGain(); g.gain.value = 0.12 * k * (m === 20 ? 1 : 0.6);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur);
  }
}

// ---- cámara y mano ----
$("ini").onclick = async () => {
  $("ini").disabled = true;
  try {
    const v = $("v");
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: 640, height: 480 }, audio: false });
    await v.play();
    $("info").textContent = "Cargando modelo de manos…";
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const model = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
    let hl;
    try { hl = await HandLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: model, delegate: "GPU" }, runningMode: "VIDEO", numHands: 1 }); }
    catch (e) { hl = await HandLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: model, delegate: "CPU" }, runningMode: "VIDEO", numHands: 1 }); }
    let last = -1, lastSend = 0;
    const loop = () => {
      if (v.currentTime !== last) {
        last = v.currentTime;
        const r = hl.detectForVideo(v, performance.now());
        const p = r.landmarks && r.landmarks[0] && r.landmarks[0][8];   // punta del índice
        if (p) {
          $("info").textContent = rol === "cenital" ? "x " + p.x.toFixed(2) + "  y " + p.y.toFixed(2) : "z " + p.y.toFixed(2);
          const now = performance.now();
          if (now - lastSend > 70) {
            lastSend = now;
            cli.publish(base + "/" + rol, JSON.stringify(rol === "cenital" ? { x: p.x, y: p.y } : { z: p.y }));
          }
        } else $("info").textContent = "Sin mano detectada";
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { $("info").textContent = "Error: " + e.message; $("ini").disabled = false; }
};
</script></body></html>
