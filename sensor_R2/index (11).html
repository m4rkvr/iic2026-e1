<title>Máximos por sector · ciclones tropicales 2000-2026</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2a22;--mut:#5d6b62;--line:#d5ddd6;--acc:#4e6b52;--dm:#c62828;--af:#d35400;--aft:#b84400;--sea:#0f1d26;--land:#4f6b58}
@media(prefers-color-scheme:dark){:root{--bg:#151b17;--card:#1e2721;--ink:#e8efe9;--mut:#9fb0a4;--line:#33423a;--acc:#8fb894;--dm:#ff6b61;--af:#ffa94d;--aft:#ffa94d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Manrope,"Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1240px;margin:0 auto;padding:18px 14px 10px}
h1{margin:0;font:900 clamp(24px,3.4vw,38px)/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em;color:var(--acc);text-align:center}
.sub{margin:6px 0 14px;text-align:center;color:var(--mut)}
.seg{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--k)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.chip[aria-pressed=true] i{box-shadow:0 0 0 2px var(--bg)}
.chip:focus-visible,.row:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:14px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.mapc{background:var(--sea);padding:6px}
svg{display:block;width:100%;height:auto}
.land{fill:var(--land)}
.b{transition:opacity .15s}
.b.dim{opacity:.25}
.nm{font-size:19px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#0f1d26;stroke-width:3.5px;stroke-linejoin:round;text-anchor:middle}
.nm.o{fill:#ffc58a}
.sc{font-size:14px;font-weight:600;fill:#d5e2da;paint-order:stroke;stroke:#0f1d26;stroke-width:3px;text-anchor:middle}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:minmax(90px,.9fr) 1.6fr auto;gap:2px 12px;align-items:center;padding:6px 6px;border-radius:8px}
.row:hover,.row.hl{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.rn b{display:block;font-weight:600}.rn small{display:block}.wd{color:var(--ink)!important;font-weight:600}.rn small{color:var(--mut);font-size:12px}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{height:12px;border-radius:2px;background:var(--dm);min-width:3px}
.bar.a{background:var(--af)}
.val{font-weight:800;font-size:17px;text-align:right;white-space:nowrap}
.val small{display:block;font-size:12px;color:var(--aft);font-weight:700}
.val .vd{color:var(--dm)}.val .va{color:var(--aft)}
.sub2{grid-column:2/4;font-size:12.5px;color:var(--aft);margin-top:-4px}
.none{font-style:italic;color:var(--mut);font-size:13px}
.foot{margin:14px 6px 4px;font-size:11.5px;line-height:1.5;color:var(--mut)}
